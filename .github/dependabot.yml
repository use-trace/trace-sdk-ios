# Weekly dependency updates. Each pull request goes through the same checks as any other before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      # A byte for byte copy of use-trace/trace's pr-loop.yml, whose action pins use-trace/trace owns. A bump here
      # would only make the copy drift; use-trace/trace's workflow-copies.yml brings its bumps over in a pull request.
      - .github/workflows/pr-loop.yml
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
